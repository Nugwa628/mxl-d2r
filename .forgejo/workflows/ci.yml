# CI on the private CI server (Forgejo runner, label mxl-cross). Code only: no game files are
# needed or present. What runs:
#   plugin  cross-build of mxl-core.dll (clang-cl + lld-link + xwin MSVC CRT/SDK; same ABI as the MSVC build on the game PC)
#   tests   the pure unit tests (plugin/tests) built natively with g++ and run
#   tools   Python syntax check of tools/
#   assets  asset pack tool tests; assets.lock against the pack in the runner cache (below)
# The boot check and the in-game smoke run (tools/game_ctl.py) need the game and stay on the game PC.
#
# Assets (Median XL's files, HD art; not in git, docs/setup.md step 4) come from a cache on the runner, never a download:
#   /var/cache/mxl-assets/assets-<version>.zip      the pack named in assets.lock (sha256 checked)
#   /var/cache/mxl-assets/<version>/assets/         the same, unpacked once (jobs link it, no copy)
# Seed it once per assets.lock version, on the runner, with the zip built by `tools/asset_pack.py build` on the game PC (or the
# release asset of tag assets-<version>):
#   mkdir -p /var/cache/mxl-assets/<version> && cp assets-<version>.zip /var/cache/mxl-assets/
#   python3 tools/asset_pack.py fetch --from /var/cache/mxl-assets --dest /var/cache/mxl-assets/<version>/assets
# A PR that bumps assets.lock shows the `assets` job's warning until the cache has the new pack. Set
# MXL_ASSETS_REQUIRED=1 in that job's env to make a missing or different cache fail the job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: mxl-cross
    steps:
      - uses: https://git.werdegames.com/actions-mirror/checkout@v4
      - name: PluginSDK submodule
        run: git submodule update --init --depth 1 third_party/PluginSDK
      - name: Build mxl-core.dll
        run: |
          cmake -S plugin -B build -DCMAKE_TOOLCHAIN_FILE="$PWD/plugin/cmake/xwin-toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j6 --target mxl_core
          ls -la build/mxl-core.dll

  launcher:
    runs-on: mxl-cross
    steps:
      - uses: https://git.werdegames.com/actions-mirror/checkout@v4
      - name: Build D2R-XL-Downloader.exe (docs/launcher.md)
        run: |
          cmake -S launcher -B build-launcher -DCMAKE_TOOLCHAIN_FILE="$PWD/plugin/cmake/xwin-toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-launcher -j6 --target mxl_launcher
          ls -la build-launcher/D2R-XL-Downloader.exe
          # unsigned build + its sha256; signing is a later step (tools/sign_launcher.py, docs/launcher.md)
          cat build-launcher/D2R-XL-Downloader.exe.sha256
          (cd build-launcher && sha256sum -c D2R-XL-Downloader.exe.sha256)

  launcher-tests:
    runs-on: mxl-cross
    steps:
      - uses: https://git.werdegames.com/actions-mirror/checkout@v4
      - name: Downloader unit tests (portable core, 7z decoder, g++)
        run: |
          cmake -S launcher/tests -B build-launcher-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-launcher-tests -j6
          ./build-launcher-tests/launcher_tests

  tests:
    runs-on: mxl-cross
    steps:
      - uses: https://git.werdegames.com/actions-mirror/checkout@v4
      - name: Build unit tests
        run: |
          cmake -S plugin/tests -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j6 --target tests
      - name: Run unit tests
        run: |
          set -e
          for t in mxl_tests craft_tests goblin_tests nocorpse_tests cooldown_tests harness_tests clientmsg_tests strings_tests mapmem_tests buildguard_tests otherplugins_tests envguard_tests renderpool_tests; do ./build-tests/$t; done

  tools:
    runs-on: mxl-cross
    steps:
      - uses: https://git.werdegames.com/actions-mirror/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Publisher, server ingest, Space mirror and test-host unit tests (tools/publish_release.py, dl_ingest.py, dl_sync.py, serve_dir.py)
        run: cd tools && python3 -m unittest test_publish_release test_dl_ingest test_dl_sync   # real 7-Zip if installed, else tools/fake_7z.py; rclone is always tools/fake_rclone.py
      - name: Launcher signing step unit tests (tools/sign_launcher.py)
        run: cd tools && python3 -m unittest test_sign_launcher
      - name: No private details in tracked text (tools/check_public.py; allowlist tools/check_public.allow)
        run: python3 tools/check_public.py
      - name: Median inputs come from assets/median (D2R-only release, docs/setup.md)
        run: |
          if grep -rnE '"extract" / "mxl"|mxl_extracted"? / "2_txt"|DEFAULT_MXL = SUGMA' tools --include=*.py; then
            echo "tools must read Median's files from assets/median, not extract/mxl or ..\mxl_extracted"; exit 1
          fi

  assets:
    runs-on: mxl-cross
    env:
      MXL_ASSETS: /var/cache/mxl-assets
    steps:
      - uses: https://git.werdegames.com/actions-mirror/checkout@v4
      - name: Asset pack tool tests
        run: python3 tools/test_asset_pack.py
      - name: assets.lock matches the pack in the runner cache
        run: |
          if python3 tools/asset_pack.py check-pack "$MXL_ASSETS"; then
            python3 tools/asset_pack.py fetch --link --force
            python3 tools/asset_pack.py verify --full
          elif [ "${MXL_ASSETS_REQUIRED:-}" = 1 ]; then
            echo "runner cache $MXL_ASSETS lacks the pack pinned in assets.lock (seed it: comment at the top of this file)"; exit 1
          else
            echo "::warning::runner cache $MXL_ASSETS lacks the pack pinned in assets.lock; not verified"
          fi
